<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  h2 { margin-bottom: 20px; }

  .input-box {
    position: relative;
    margin-bottom: 15px;
  }

  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
  }

  input:focus {
    border-color: #667eea;
  }

  .toggle {
    position: absolute;
    right: 10px;
    top: 10px;
    cursor: pointer;
    font-size: 14px;
    color: #666;
  }

  .strength {
    font-size: 12px;
    text-align: left;
    margin-bottom: 10px;
  }

  .weak { color: red; }
  .medium { color: orange; }
  .strong { color: green; }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #667eea;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .error {
    color: red;
    font-size: 13px;
    margin-bottom: 10px;
  }

  .success {
    color: green;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .link {
    margin-top: 15px;
    font-size: 14px;
  }

  .link a {
    color: #667eea;
    text-decoration: none;
  }
</style>
</head>

<body>

<div class="card">
  <h2>Create Account</h2>

  <div id="message"></div>

  <div class="input-box">
    <input id="username" placeholder="Email or Username">
  </div>

  <div class="input-box">
    <input id="password" type="password" placeholder="Password">
    <span class="toggle" onclick="togglePassword('password')">👁️</span>
  </div>

  <div class="strength" id="strength"></div>

  <div class="input-box">
    <input id="confirm" type="password" placeholder="Confirm Password">
    <span class="toggle" onclick="togglePassword('confirm')">👁️</span>
  </div>

  <button id="btn" onclick="register()">Register</button>

  <div class="link">
    Already have an account? <a href="/">Login</a>
  </div>
</div>
<span onclick="togglePassword()">👁️</span>

<script>
function togglePassword() {
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
}
</script>
<script>

const passwordInput = document.getElementById("password");
const strengthText = document.getElementById("strength");

passwordInput.addEventListener("input", () => {
  const val = passwordInput.value;

  if (val.length < 6) {
    strengthText.textContent = "Weak password";
    strengthText.className = "strength weak";
  } else if (val.match(/[A-Z]/) && val.match(/[0-9]/)) {
    strengthText.textContent = "Strong password";
    strengthText.className = "strength strong";
  } else {
    strengthText.textContent = "Medium password";
    strengthText.className = "strength medium";
  }
});

function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

document.addEventListener("keypress", function(e) {
  if (e.key === "Enter") register();
});

async function register() {

  const username = document.getElementById("username").value.trim();
  const password = passwordInput.value.trim();
  const confirm = document.getElementById("confirm").value.trim();
  const msg = document.getElementById("message");
  const btn = document.getElementById("btn");

  msg.innerHTML = "";

  // Validation
  if (!username || !password || !confirm) {
    msg.innerHTML = '<div class="error">All fields are required</div>';
    return;
  }

  if (!username.includes("@") && username.length < 3) {
    msg.innerHTML = '<div class="error">Invalid username/email</div>';
    return;
  }

  if (password !== confirm) {
    msg.innerHTML = '<div class="error">Passwords do not match</div>';
    return;
  }

  try {
    btn.textContent = "Please wait...";
    btn.disabled = true;

    const res = await fetch("/register", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({username, password})
    });

    if (!res.ok) throw new Error("Registration failed");

    msg.innerHTML = '<div class="success">Account created successfully!</div>';

    setTimeout(() => {
      window.location = "/";
    }, 1500);

  } catch (err) {
    msg.innerHTML = `<div class="error">${err.message}</div>`;
  } finally {
    btn.textContent = "Register";
    btn.disabled = false;
  }
}
if (!username.includes("@") || !username.includes(".")) {
  showError("Enter valid email");
  return;
}
</script>

</body>
</html>
